App\Entity\Location:
    properties:
        city:
            - NotBlank: { groups: [create, edit] }
            - Length:
                  min: 2
                  max: 255
                  groups: [create, edit]
        country:
            - NotBlank: { groups: [create, edit] }
            - Choice:
                  choices: ['PL', 'DE', 'FR', 'ES', 'IT', 'GB', 'US']
                  groups: [create, edit]
        latitude:
            - NotBlank: { groups: [create, edit] }
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: "This value should be between -90 and 90."
                  groups: [create, edit]
        longitude:
            - NotBlank: { groups: [create, edit] }
            - Range:
                  min: -180
                  max: 180
                  notInRangeMessage: "This value should be between -180 and 180."
                  groups: [create, edit]

App\Entity\Measurement:
    properties:
        celsius:
            - NotBlank: { groups: [create, edit] }
            - Range:
                  min: -60
                  max: 60
                  notInRangeMessage: "Temperature must be between -60 and 60 °C."
                  groups: [create, edit]
        date:
            - NotBlank: { groups: [create, edit] }
        location:
            - NotBlank: { groups: [create, edit] }
